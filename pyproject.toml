[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "pytorch-ddp-scaling-lab"
version = "0.1.0"
description = "Distributed deep learning scaling benchmark using PyTorch DDP, NCCL, Slurm, ResNet, and U-Net."
requires-python = ">=3.10"


[tool.setuptools.packages.find]
where = ["src"]